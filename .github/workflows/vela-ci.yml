name: Vela CI

on:
  push:
    branches: ['main']
    paths:
      - 'packages/apps/vela/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/vela-ci.yml'
      - '.github/workflows/vela-release.yml'
      - '.github/actions/vela/**'
  pull_request:
    branches: ['main']
    paths:
      - 'packages/apps/vela/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/vela-ci.yml'
      - '.github/workflows/vela-release.yml'
      - '.github/actions/vela/**'

permissions:
  contents: read

concurrency:
  group: vela-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-macos:
    name: Vela macOS arm64 verification
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      VELA_BUILD_DIR: ${{ github.workspace }}/packages/apps/vela/.tmp/ci-build
      VELA_ARTIFACT_DIR: ${{ github.workspace }}/packages/apps/vela/.tmp/ci-artifacts
      VELA_REPORT_DIR: ${{ github.workspace }}/packages/apps/vela/.tmp/release
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure isolated CI paths
        run: echo "VELA_TOOLCHAIN_CACHE=$RUNNER_TOOL_CACHE/vela" >> "$GITHUB_ENV"

      - name: Prepare pinned toolchain
        uses: ./.github/actions/vela/setup-toolchain

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Read application version
        id: version
        run: echo "value=$(node -p "require('./packages/apps/vela/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify, build, smoke-test and package macOS
        timeout-minutes: 20
        uses: ./.github/actions/vela/build-macos
        with:
          version: ${{ steps.version.outputs.value }}
          app-output: ${{ env.VELA_BUILD_DIR }}
          package-output: ${{ env.VELA_ARTIFACT_DIR }}

      - name: Upload non-release CI ZIP
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: vela-ci-macos-arm64-${{ github.sha }}
          path: packages/apps/vela/.tmp/ci-artifacts/*.zip
          if-no-files-found: error
          retention-days: 3

      - name: Upload redacted failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: vela-redacted-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/apps/vela/.tmp/release/**
          if-no-files-found: ignore
          retention-days: 3
