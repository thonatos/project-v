name: Vela pinned toolchain
description: Provision Node.js, Go, pnpm, Rust and verified NSH and Sparkle distributions.

runs:
  using: composite
  steps:
    - name: Set up Node.js 24
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'

    - name: Set up Go 1.27.2
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
      with:
        go-version: '1.27.2'
        cache: false

    - name: Activate pnpm 12.14.0
      id: pnpm-store
      shell: bash
      working-directory: packages/apps/vela
      run: |
        corepack enable
        corepack install --global pnpm@12.14.0
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Select Rust 1.98.1
      shell: bash
      working-directory: packages/apps/vela
      run: |
        rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
        rustup default 1.98.1

    - name: Restore content-addressed toolchain and dependency cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ${{ env.VELA_TOOLCHAIN_CACHE }}
          ${{ steps.pnpm-store.outputs.path }}
          ~/.cargo/registry
          ~/.cargo/git
          ~/go/pkg/mod
        key: vela-${{ runner.os }}-${{ runner.arch }}-nsh-a189be8537422a147131c88d7fd39d73265a6aebfbb530287c36a393ff3953fc-sparkle-1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27-${{ hashFiles('pnpm-lock.yaml', 'packages/apps/vela/Cargo.lock', 'packages/apps/vela/core/go.sum') }}

    # A cache hit is re-hashed before extraction or execution.
    - name: Prepare and revalidate the pinned toolchain
      shell: bash
      working-directory: packages/apps/vela
      run: sh scripts/release/prepare-ci-toolchain.sh "$VELA_TOOLCHAIN_CACHE"

    - name: Verify declaration and runner architecture
      shell: bash
      working-directory: packages/apps/vela
      run: |
        node scripts/release/check-toolchain.mjs
        test "$(uname -m)" = arm64
        xcode_version=$(xcodebuild -version)
        case "$xcode_version" in
          "Xcode 27"*) ;;
          *) echo "Unexpected Xcode version: $xcode_version" >&2; exit 1 ;;
        esac
