[workspace]
members = ["host", "ios/native"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.98"

[workspace.dependencies]
nsh-core = "=0.2.0"
nsh-platform-macos = "=0.2.0"
nsh-platform-ios = "=0.2.0"
nsh-base = "=0.2.0"
objc2 = "=0.6.5"
objc2-core-foundation = { version = "=0.3.2", features = ["CFCGTypes"] }
objc2-ui-kit = { version = "=0.3.2", features = ["UIApplication", "UIResponder", "UIScene", "UISceneConfiguration", "UISceneSession", "UISceneOptions", "UIViewController", "UIWindow", "UIWindowScene", "UIView", "UIColor", "UIScreen", "UIDevice", "UIImage", "UIImageView", "UIImageConfiguration", "UIImageSymbolConfiguration", "UIControl", "UISwitch", "UISegmentedControl", "UIGeometry", "UIInterface", "NSLayoutAnchor", "NSLayoutConstraint", "UIKeyboardLayoutGuide", "UILayoutGuide"] }
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", features = ["NSButton", "NSColor", "NSFont", "NSImage", "NSOpenPanel", "NSSavePanel"] }
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSData", "NSBundle", "NSError", "NSDictionary", "NSFileManager", "NSNotification", "NSObject", "NSOperation", "NSString", "NSValue", "NSURL", "NSURLRequest", "NSURLResponse", "NSUUID"] }
objc2-web-kit = { version = "=0.3.2", features = ["objc2-app-kit", "objc2-core-foundation", "WKDownload", "WKDownloadDelegate", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKOpenPanelParameters", "WKUIDelegate", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKUserContentController", "WKUserScript", "WKScriptMessage"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
