packages:
  - 'packages/apps/*'
  - 'packages/libs/*'
  - 'packages/plugins/*'
  - 'packages/tools/*'
catalog:
  vite-plus: 1.3.0
allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  bufferutil: true
  es5-ext: true
  esbuild: true
  keccak: true
  sharp: true
  utf-8-validate: true
  workerd: true
minimumReleaseAgeExclude:
  - i18next-cli@1.62.0
  - '@scriptc/compiler@0.0.28'
  - '@scriptc/runtime@0.0.28'
  - scriptc@0.0.28
overrides:
  'react@^19.0.0': 19.2.5
  'react-dom@^19.0.0': 19.2.5
  style-to-js: ^1.1.16
